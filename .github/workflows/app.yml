name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web placeholder
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="background:#0d0805"></body></html>' > www/index.html
      - run: npm install
      - run: npx cap add android
      - name: App icon (same logo as the website)
        run: |
          curl -sfL https://istighfar-3la-mahl.netlify.app/icon-512.png -o icon512.png
          npm install --no-save @capacitor/assets@4
          mkdir -p assets
          node mkicons.js
          npx @capacitor/assets generate --android
      - name: Add native alarm plugin
        run: |
          D=android/app/src/main/java/com/istighfar/mahl
          mkdir -p $D
          cat > $D/AlarmSetPlugin.java <<'JAVA'
          package com.istighfar.mahl;

          import android.content.Intent;
          import android.provider.AlarmClock;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AlarmSet")
          public class AlarmSetPlugin extends Plugin {
              @PluginMethod
              public void set(PluginCall call) {
                  Intent i = new Intent(AlarmClock.ACTION_SET_ALARM);
                  i.putExtra(AlarmClock.EXTRA_HOUR, call.getInt("hour", 4));
                  i.putExtra(AlarmClock.EXTRA_MINUTES, call.getInt("minutes", 0));
                  i.putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("message", "Qiyam"));
                  i.putExtra(AlarmClock.EXTRA_SKIP_UI, call.getBoolean("skipUi", false));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      getActivity().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("no clock app: " + e.getMessage());
                  }
              }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.istighfar.mahl;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AlarmSetPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk istighfar-3la-mahl.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: istighfar-3la-mahl.apk
